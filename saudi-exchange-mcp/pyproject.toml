[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "saudi-exchange-reports"
version = "0.1.0"
description = "Saudi Exchange company identity, report listing, original-PDF retrieval, page-level reading, Google Finance research, and a local stdio MCP server (Hybrid MCP slices 01–05)."
requires-python = ">=3.12"
dependencies = [
  "pypdf>=5.0",
  "pillow>=10.0",
  "pytesseract>=0.3.13",
  "pdf2image>=1.17",
  "pdfplumber>=0.11",
  "httpx>=0.27",
  "anyio>=4.0",
  "mcp>=1.30,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "reportlab>=4.0"]
browser = ["playwright>=1.40"]

[project.scripts]
saudi-exchange-reports = "saudi_exchange_reports.cli:main"
saudi-exchange-mcp = "saudi_exchange_reports.mcp:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-q"
markers = [
  "stored_pdf: tests that require a gitignored stored original PDF",
  "live_google: hits Google Finance over the network; skipped unless --live-google or SAUDI_LIVE_GOOGLE=1",
  "live_mcp: live stdio MCP session; skipped unless --live-google/--live-mcp or SAUDI_LIVE_GOOGLE=1",
]
